
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFRUDDONAT</title>

<style>
  /* Posizione percentuale dei 4 personaggi (da sinistra a destra) */
#nico {
    top: 25%;
    left: 4.5%;
    width: 21%;
    height: 55%;
}

#alessio {
    top: 25%;
    left: 28.5%;
    width: 21%;
    height: 55%;
}

#matteo {
    top: 25%;
    left: 52.5%;
    width: 21%;
    height: 55%;
}

#gigi {
    top: 25%;
    left: 76.5%;
    width: 21%;
    height: 55%;
}

/* Posizione del tasto PLAY in basso al centro */
#play {
    position: absolute;
    bottom: 6%;
    left: 36%;
    width: 28%;
    height: 11%;
    background: transparent;
    border: none;
    cursor: pointer;
    z-index: 20;
}

/* Stile per evidenziare il personaggio quando viene cliccato */
button.character.selected {
    border: 3px solid #ffd34f;
    border-radius: 12px;
    background: rgba(255, 211, 79, 0.2);
}
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #100d20;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #ffd34f;
  font-size: clamp(25px, 5vw, 45px);
  letter-spacing: 4px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 15px;
}

.artwork {
  position: relative;
  width: 100%;
}

.artwork img {
  display: block;
  width: 100%;
  height: auto;
  border: 3px solid #ffd34f;
  border-radius: 12px;
}

.character {
  position: absolute;
  top: 25%;
  height: 60%;
  width: 23%;
  border: 3px solid transparent;
  background: transparent;
  cursor: pointer;
  border-radius: 12px;
}

.character:hover,
.character.selected {
  border-color: #ffe36b;
  background: #ffffff22;
}

#nico { left: 2%; }
#alessio { left: 26%; }
#matteo { left: 50%; }
#gigi { left: 74%; }

#play {
  position: absolute;
  left: 38%;
  bottom: 1%;
  width: 24%;
  height: 12%;
  background: transparent;
  border: none;
  cursor: pointer;
}

#info {
  display: none;
  background: #251a43;
  border: 2px solid #ffd34f;
  border-radius: 15px;
  padding: 25px;
  margin-top: 20px;
}

#info h2 { color: #ffd34f; }

button.action {
  background: #ffd34f;
  color: #20152d;
  border: none;
  padding: 14px 22px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

@media(max-width:600px) {
  main { padding: 5px; }
}
</style>
</head>

<body>

<main>
<h1>SFRUDDONAT</h1>
<p>THE FOUR STARTERS</p>

<div class="artwork" id="menu">

<img src="menu-sfruddonat.png" alt="Sfruddonato - selezione personaggi">
<button class="character" id="nico"
 aria-label="NicoPav" onclick="select('nico',this)"></button>

<button class="character" id="alessio"
 aria-label="Alessio" onclick="select('alessio',this)"></button>

<button class="character" id="matteo"
 aria-label="Matteo" onclick="select('matteo',this)"></button>

<button class="character" id="gigi"
 aria-label="Gigi" onclick="select('gigi',this)"></button>

<button id="play" onclick="play()"
 aria-label="Play"></button>

</div>

<p id="hint">Seleziona il tuo starter!</p>

<section id="info">
<h2 id="name"></h2>
<p id="description"></p>
<button class="action" onclick="play()">START ADVENTURE</button>
<button class="action" onclick="back()">BACK</button>
</section>

</main>

<script>

const characters = {
nico: {
name: "NICOPAV",
description: "Holy Scholar. La tua missione è superare le tentazioni, studiare e raggiungere la meta divina."
},
alessio: {
name: "ALESSIO",
description: "Cyber Psychologist. Sei un bot esperto di psicologia che deve imparare a comprendere gli esseri umani."
},
matteo: {
name: "MATTEO",
description: "Urban Rebel. Torino è il tuo terreno di gioco: documenta le assurdità del sistema."
},
gigi: {
name: "GIGI",
description: "Napoli Striker. Allenati, dribbla gli avversari e conquista la gloria azzurra."
}
};

let selected = null;
let started = false;

function select(id, element) {
  selected = id;

  document.querySelectorAll(".character")
    .forEach(b => b.classList.remove("selected"));

  element.classList.add("selected");

  document.getElementById("name").textContent =
    characters[id].name;

  document.getElementById("description").textContent =
    characters[id].description;

  document.getElementById("info").style.display = "block";
}

function play() {
  if (!selected) {
    alert("DEVI SCEGLIERE UNO STARTER!");
    return;
  }

  document.getElementById("menu").style.display = "none";
  document.getElementById("hint").style.display = "none";

  document.getElementById("name").textContent =
    characters[selected].name;

  document.getElementById("description").textContent =
    "Benvenuto nel tuo mondo! La tua avventura sta per iniziare.";

  document.getElementById("info").style.display = "block";
  started = true;
}

function back() {
  document.getElementById("menu").style.display = "block";
  document.getElementById("hint").style.display = "block";
  document.getElementById("info").style.display = "none";

  selected = null;
  started = false;

  document.querySelectorAll(".character")
    .forEach(b => b.classList.remove("selected"));
}

</script>

</body>
</html>
